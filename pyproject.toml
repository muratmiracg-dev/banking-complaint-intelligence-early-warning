[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-complaint-intelligence"
version = "1.0.0"
description = "Reproducible CFPB complaint NLP and statistical early warning workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Murat Miraç Gedik"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2"]

[project.scripts]
complaint-intelligence = "complaint_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["complaint_intelligence*"]
